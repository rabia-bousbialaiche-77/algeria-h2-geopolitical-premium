# ---------------------------------------------------------------------------
# Production, transport and conversion parameters for the Algerian export
# cost model (Supplementary Material, Section S3 and Table S2).
#
# Every entry carries:
#   dist   : fixed | triangular | uniform
#   value  : (fixed)            low/mode/high : (triangular)   low/high : (uniform)
#   unit   : physical unit
#   source : reference key (see docs/REFERENCES.md) or "physical constant"
#   basis  : how the value was obtained. Entries marked AUTHOR ASSUMPTION
#            are modelling choices that must be justified or replaced with a
#            sourced value before submission.
# Price basis: constant 2023 US dollars. 2030 calibration (electrolyser CAPEX only).
# ---------------------------------------------------------------------------

# --- Solar PV supply (all exporters) ------------------------------------------
pv_capex_usd_per_kw:
  dist: triangular
  low: 550
  mode: 758
  high: 950
  unit: USD2023/kW
  source: IRENA_2024
  basis: "Mode = global weighted-average total installed cost of utility-scale PV commissioned in 2023 (IRENA, 2024). Bounds: AUTHOR ASSUMPTION."

pv_fixed_om_usd_per_kw_yr:
  dist: triangular
  low: 9
  mode: 12
  high: 15
  unit: USD2023/kW/yr
  source: AUTHOR
  basis: "AUTHOR ASSUMPTION (about 1.6% of the PV capital cost per year)."

pv_yield_factor:
  dist: triangular
  low: 0.95
  mode: 1.00
  high: 1.05
  unit: multiplier on the site PVOUT in countries.yaml
  source: GSA_2026
  basis: "Site long-term PVOUT from the Global Solar Atlas (countries.yaml). +/-5% band for model and inter-annual uncertainty: AUTHOR ASSUMPTION. The same draw is applied to all countries (common random numbers)."

pv_lifetime_yr:
  dist: fixed
  value: 25
  unit: yr
  source: AUTHOR
  basis: "AUTHOR ASSUMPTION."

# --- Electrolysis ------------------------------------------------------------
el_capex_usd_per_kw:
  dist: triangular
  low: 950
  mode: 1250
  high: 1450
  unit: USD/kW (installed, 2030)
  source: IEA_2024
  basis: "2030 projection. IEA (2024): installed costs fall to about USD 1,250-1,450/kW by 2030 in the Stated Policies Scenario and below USD 1,000/kW in the Net Zero Scenario. Mode: AUTHOR ASSUMPTION."

el_fixed_om_share:
  dist: fixed
  value: 0.025
  unit: share of CAPEX per yr
  source: AUTHOR
  basis: "AUTHOR ASSUMPTION."

el_lifetime_yr:
  dist: fixed
  value: 20
  unit: yr
  source: AUTHOR
  basis: "AUTHOR ASSUMPTION. Stack replacement is not modelled separately (limitation)."

el_sec_kwh_per_kg:
  dist: triangular
  low: 50
  mode: 53
  high: 56
  unit: kWh/kg H2
  source: AUTHOR
  basis: "AUTHOR ASSUMPTION; to be confirmed against IRENA (2020) / Schmidt et al. (2017) before submission."

el_to_pv_ratio:
  dist: fixed
  value: 0.70
  unit: kW_el per kWp
  source: AUTHOR
  basis: "AUTHOR ASSUMPTION (electrolyser undersized relative to PV to raise full-load hours)."

clipping_loss:
  dist: fixed
  value: 0.03
  unit: share of PV output
  source: AUTHOR
  basis: "AUTHOR ASSUMPTION."

# --- Water -----------------------------------------------------------------
water_m3_per_kg:
  dist: fixed
  value: 0.035
  unit: m3 desalinated water per kg H2
  source: PtXHub_2024
  basis: "PtX Hub (2024): about 35 kg of desalinated water per kg H2 including cooling."

desal_cost_usd_per_m3:
  dist: triangular
  low: 0.6
  mode: 1.0
  high: 1.5
  unit: USD/m3
  source: AUTHOR
  basis: "AUTHOR ASSUMPTION; to be checked against Chahtou and Taoussi (2025)."

# --- Cost of capital ---------------------------------------------------------
# Country WACC is built in countries.yaml (WACC_ref + country premium).

# --- Transport to Europe -----------------------------------------------------
pipeline_transport_eur_per_mwh:
  dist: triangular
  low: 9
  mode: 14
  high: 19
  unit: EUR/MWh (LHV)
  source: Timmerberg_2019
  basis: "Timmerberg and Kaltschmitt (2019): minimum transport cost 9 (low case) and 19 (high case) EUR/MWh for North African hydrogen blended into existing pipelines to Central Europe. Mode: midpoint."

nh3_chain_10k_usd_per_kg:
  dist: triangular
  low: 2.5
  mode: 3.5
  high: 4.5
  unit: USD/kg H2
  source: IRENA_2022b
  basis: "IRENA (2022b): transport cost of hydrogen as ammonia in 2030, excluding hydrogen production, USD 2.5-4.5/kg H2 for 10,000 km (conversion, storage, shipping, reconversion). The distance-independent part (synthesis, storage, cracking) is this value minus the bottom-up shipping cost at 10,000 km; the shipping part is then recomputed for each route."

ship_speed_kn:
  dist: triangular
  low: 14
  mode: 15
  high: 17
  unit: knots
  source: AUTHOR
  basis: "AUTHOR ASSUMPTION (service speed of large gas carriers)."

ship_port_days_per_call:
  dist: fixed
  value: 2
  unit: days per port call (two calls per round trip)
  source: AUTHOR
  basis: "AUTHOR ASSUMPTION."

ship_operating_days_yr:
  dist: fixed
  value: 350
  unit: days/yr
  source: AUTHOR
  basis: "AUTHOR ASSUMPTION."

ship_life_yr:
  dist: fixed
  value: 25
  unit: yr
  source: AUTHOR
  basis: "AUTHOR ASSUMPTION."

ship_wacc:
  dist: fixed
  value: 0.08
  unit: real, per yr
  source: AUTHOR
  basis: "AUTHOR ASSUMPTION (international ship finance, independent of exporter)."

ship_om_share:
  dist: fixed
  value: 0.025
  unit: share of ship CAPEX per yr
  source: IRENA_2022b
  basis: "IRENA (2022b): operating cost of ammonia carriers taken as 2.5% of CAPEX per year."

ship_fuel_share_per_5000km:
  dist: fixed
  value: 0.01
  unit: share of cargo consumed per 5,000 km per leg
  source: IRENA_2022b
  basis: "IRENA (2022b): ballast-leg fuel in the order of 1% of the full cargo for every 5,000 km; the laden leg is assumed equal (AUTHOR ASSUMPTION)."

canal_tariff_usd_per_kg:
  dist: fixed
  value: 0.07
  unit: USD/kg H2 per round trip
  source: IRENA_2022b
  basis: "IRENA (2022b), Box 2.1: Suez round trip USD 0.65-0.75 million, about USD 0.07/kg H2 for a 60,000 t NH3 carrier. Applied also to the Panama Canal (AUTHOR ASSUMPTION)."

listed_transits_per_roundtrip:
  dist: fixed
  value: 2
  unit: additional-premium charges per round trip through a listed area
  source: AUTHOR
  basis: "AUTHOR ASSUMPTION: the additional war-risk premium is charged on entry to a listed area, once on the ballast leg and once on the laden leg."

eur_usd:
  dist: fixed
  value: 1.08
  unit: USD per EUR
  source: AUTHOR
  basis: "2023 annual average EUR/USD reference rate (approximately 1.08); confirm against the ECB series."

lhv_kwh_per_kg:
  dist: fixed
  value: 33.33
  unit: kWh/kg
  source: physical constant
  basis: "Lower heating value of hydrogen."

# --- Vessel and cargo (used to convert war-risk premiums) -----------------------
hull_value_usd:
  dist: triangular
  low: 110000000
  mode: 125000000
  high: 135000000
  unit: USD
  source: DNV_2024
  basis: "DNV (2024): newbuilding price of a 93,000 m3 LPG/ammonia-capable carrier about USD 125 million in 2024. Bounds: AUTHOR ASSUMPTION."

cargo_m3:
  dist: fixed
  value: 93000
  unit: m3
  source: DNV_2024
  basis: "Very large ammonia carrier class (93,000 m3)."

nh3_density_t_per_m3:
  dist: fixed
  value: 0.682
  unit: t/m3
  source: physical constant
  basis: "Liquid ammonia at -33 C."

cargo_fill:
  dist: fixed
  value: 0.98
  unit: share
  source: AUTHOR
  basis: "AUTHOR ASSUMPTION."

h2_mass_fraction_nh3:
  dist: fixed
  value: 0.1776
  unit: kg H2 per kg NH3
  source: physical constant
  basis: "Stoichiometry 3*1.008/17.031."

# --- Carbon term ---------------------------------------------------------------
embedded_emissions_kgco2_per_kg:
  dist: fixed
  value: 0.0
  unit: kg CO2 per kg H2
  source: AUTHOR
  basis: "Direct embedded emissions of renewable electrolytic hydrogen set to zero (CBAM definitive regime from 1 January 2026; European Commission, n.d.-a). Change to test non-zero intensities."

ets_price_eur_per_t:
  dist: fixed
  value: 80
  unit: EUR/t CO2
  source: AUTHOR
  basis: "AUTHOR ASSUMPTION; only used when embedded_emissions_kgco2_per_kg > 0."

# --- Bounding variants (not used in the baseline results) --------------------
midstream_capital_share:
  dist: fixed
  value: 0.70
  unit: share of the pipeline tariff and of the distance-independent ammonia cost
  source: AUTHOR
  basis: "AUTHOR ASSUMPTION for the midstream bounding variant (manuscript Section 4.4): share of the midstream cost that is capital recovery and is assumed to move with the exporter's WACC. Upper bound, because import-side cracking and the European pipeline sections are financed outside the exporting country."

midstream_life_yr:
  dist: fixed
  value: 30
  unit: yr
  source: AUTHOR
  basis: "AUTHOR ASSUMPTION for the midstream bounding variant: economic life of pipelines, synthesis plants, tanks and crackers."

fuel_value_adder_usd_per_kg:
  dist: fixed
  value: 1.0
  unit: USD/kg H2
  source: AUTHOR
  basis: "AUTHOR ASSUMPTION for the fuel-valuation variant: the cargo burnt or boiled off is ammonia, which has also borne synthesis and storage costs; the variant values it at the production cost plus this amount."
